spring.application.name=ai-trip-planner

# Notice the ".genai." in the middle! This tells Spring to use AI Studio, not Google Cloud.
spring.ai.google.genai.api-key=${Gemini_Api_Key}
# spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite


# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_trip_planner
spring.datasource.username=postgres
spring.datasource.password=pathan@786
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
